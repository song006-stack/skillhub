<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>__CSS__</style></head><body>
<header><div class="brand"><span class="mark">S</span><div><h1>SkillHub</h1></div><button id="language-open" class="add" data-i18n="language">语言</button><button id="scan" class="add" data-i18n="scan" data-i18n-title="scanTitle" data-i18n-aria="scanTitle">识别本机</button><label class="add"><span data-i18n="import">＋ 导入</span><input type="file" id="folder" webkitdirectory multiple hidden></label></div><div class="search"><span>⌕</span><input id="search" data-i18n-placeholder="search" data-i18n-aria="search" placeholder="搜索技能、功能或关键词" aria-label="搜索技能"></div><nav><button data-view="all" class="active"><span data-i18n="all">全部</span> <span id="total">0</span></button><button data-view="favorite" data-i18n="favorite">收藏</button><button data-view="recent" data-i18n="recent">最近使用</button></nav></header>
<main><div class="toolbar"><h2 id="title">全部技能</h2><select id="platform" data-i18n-aria="platform" aria-label="选择平台"><option value="all" data-i18n="allPlatforms">全部平台</option><option value="ChatGPT">ChatGPT</option><option value="Codex">Codex</option><option value="通用" data-i18n="universal">通用</option><option value="待确认" data-i18n="unconfirmed">待确认</option></select></div><p id="platform-note" class="platform-note" data-i18n="platformNote" hidden>平台由你手动标记，不能保证当前环境已安装或可调用。</p><p id="notice" role="status"></p><div id="list"></div><div id="empty" hidden><div class="empty-mark">S</div><h2 data-i18n="emptyTitle">添加你的第一个 Skill</h2><p data-i18n="emptyHelp">识别本机已有技能，或选择包含 SKILL.md 的文件夹。</p><button id="empty-scan" class="primary" data-i18n="scanLong">识别本机技能</button> <label class="primary"><span data-i18n="chooseFolder">选择文件夹</span><input type="file" id="empty-folder" webkitdirectory multiple hidden></label></div></main><footer data-i18n="footer">文件保存在本机 · 不会自动执行脚本</footer>
<dialog id="language-dialog"><div class="modal-head"><h2 data-i18n="languageTitle">界面语言</h2><button type="button" id="language-close" data-i18n-aria="close" aria-label="关闭">×</button></div><label class="language-field"><span data-i18n="languageSelect">选择语言</span><select id="language-select"></select></label><label class="primary"><span data-i18n="importLanguage">导入语言文件</span><input id="language-file" type="file" accept=".json,application/json" hidden></label><p class="language-help" data-i18n="languageHelp">导入 JSON 语言文件；缺少的文字显示中文。</p><p id="language-status" role="status"></p></dialog>
<dialog id="edit"><form id="edit-form"><div class="modal-head"><h2 data-i18n="editTitle">编辑技能</h2><button type="button" id="close" data-i18n-aria="close" aria-label="关闭">×</button></div><label><span data-i18n="name">名称</span><input name="name" required></label><label><span data-i18n="summary">简短介绍</span><input name="summary" required></label><label><span data-i18n="category">一级分类</span><select name="category"></select></label><label><span data-i18n="subcategory">二级分类</span><input name="subcategory"></label><label><span data-i18n="platform">适用平台</span><select name="platform"><option value="待确认" data-i18n="unconfirmed">待确认</option><option value="通用" data-i18n="universal">通用</option><option value="ChatGPT">ChatGPT</option><option value="Codex">Codex</option></select><small class="platform-note" data-i18n="platformNote">平台由你手动标记，不能保证当前环境已安装或可调用。</small></label><label><span data-i18n="description">详细介绍</span><textarea name="description" rows="4"></textarea></label><div class="modal-actions"><button type="button" id="remove" data-i18n="remove">删除技能</button><button class="primary" data-i18n="save">保存</button></div></form></dialog>
<script>__JS__</script></body></html>
